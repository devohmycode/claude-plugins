name: check

on:
  push:
  pull_request:

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Shared modules and locale catalogs
        run: node scripts/sync-shared.mjs --check
      - name: Scanner agent variants and /config rows
        run: node scanner-plugin/scripts/generate.mjs --check
